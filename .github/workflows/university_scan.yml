name: University Intelligence Scan

# Runs alongside the existing hackathon bot on the free GitHub Actions tier.
# Note: GitHub Actions cannot run every 30 minutes within the free minute
# budget. For a true 30-minute interval + Telegram admin commands, run the
# Docker daemon on a free always-on VM (e.g. Oracle Cloud Always Free) — see README.
on:
  schedule:
    - cron: "30 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  university-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run University Intelligence scan
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELANGANA_CHANNEL_ID: ${{ secrets.TELANGANA_CHANNEL_ID }}
          INDIA_CHANNEL_ID: ${{ secrets.INDIA_CHANNEL_ID }}
          GLOBAL_CHANNEL_ID: ${{ secrets.GLOBAL_CHANNEL_ID }}
          SCAN_INTERVAL: "30"
          SEED_ON_EMPTY: "true"
        run: python -m university_intel.worker --once

      - name: Commit updated database if changed
        run: |
          if git status --porcelain | grep -q 'data/sent_listings.db'; then
            git config user.name "university-intel-bot"
            git config user.email "actions@github.com"
            git add data/sent_listings.db
            git commit -m "Update university intelligence database [skip ci]"
            git push
          else
            echo "No database changes to commit."
          fi
